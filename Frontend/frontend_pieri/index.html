<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | SGE PIERI DICACIO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="login-body">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="card login-card">
          <div class="card-body p-4 p-md-5">
             <div class="text-center mb-5">
               <div style="width: 90px; height: 90px; margin: 0 auto 1.5rem; display: grid; place-items: center;">
                 <img 
  src="assets/img/logo.png" 
  alt="PIERI D'CACIO" 
  style="max-width: 100%; max-height: 100%; object-fit: contain;" 
  onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;brand-badge&quot;>SGE</div>';"
>
               </div>
               <h1 class="h3 fw-bold mb-1" style="color: var(--text-primary); letter-spacing: -0.02em;">PIERI DICACIO</h1>
               <p class="text-muted mb-0" style="font-size: 0.95rem;">Sistema de Gestión Empresarial</p>
             </div>

            <form id="loginForm">
              <div class="mb-4">
                <label for="usernameOrCorreo" class="form-label">Usuario o correo</label>
                <input type="text" class="form-control" id="usernameOrCorreo" placeholder="Ingresa tu usuario" required autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
              </div>

              <div id="loginAlert" class="alert d-none" role="alert"></div>

              <div class="d-grid mt-5">
                <button type="submit" class="btn btn-primary" id="btnLogin">
                  Iniciar sesión
                </button>
              </div>
            </form>

            <div class="small text-muted mt-5 text-center" style="font-size: 0.8rem; opacity: 0.7;">
              SGE PIERI DICACIO v1.0
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
