<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes | SGE PIERI DICACIO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
       <div class="sidebar-header">
         <img src="assets/img/logo.png" alt="PIERI D'CACIO" class="sidebar-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" style="display:block;">
         <div style="display:none;">
           <h5 class="mb-0">SGE</h5>
           <small>PIERI DICACIO</small>
         </div>
       </div>

        <nav class="nav flex-column sidebar-nav">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link active" href="clientes.html">Clientes</a>
          <a class="nav-link" href="pedidos.html">Pedidos</a>
          <a class="nav-link" href="pagos.html">Pagos</a>
          <a class="nav-link" href="inventario.html">Inventario</a>
          <a class="nav-link" href="bom.html">Lista de Materiales</a>
          <a class="nav-link" href="produccion.html">Producción</a>
          <a class="nav-link" href="empleados.html">Empleados</a>
          <a class="nav-link" href="usuarios.html">Usuarios</a>
          <a class="nav-link" href="reportes.html">Reportes</a>
          <a class="nav-link" href="bitacora.html">Bitácora</a>
        </nav>

      <div class="sidebar-footer mt-auto">
        <div class="small text-white-50 mb-2" id="userInfo">Usuario</div>
        <button class="btn btn-outline-light btn-sm w-100" id="btnLogout">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h4 mb-1">Clientes</h1>
          <p class="text-muted mb-0">Gestión básica de clientes</p>
        </div>
        <button class="btn btn-outline-primary d-lg-none" id="btnToggleSidebar">Menú</button>
      </header>

      <div id="clientesAlert" class="alert d-none" role="alert"></div>

      <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Nuevo cliente</h2>
          <form id="clienteForm" class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Tipo cliente</label>
              <select class="form-select" id="tipoCliente">
                <option value="INDIVIDUAL">INDIVIDUAL</option>
                <option value="EMPRESA">EMPRESA</option>
              </select>
            </div>
            <div class="col-md-5">
              <label class="form-label">Nombre o razón social</label>
              <input type="text" class="form-control" id="nombreRazonSocial" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre de contacto</label>
              <input type="text" class="form-control" id="nombreContacto">
            </div>
            <div class="col-md-3">
              <label class="form-label">NIT</label>
              <input type="text" class="form-control" id="nit">
            </div>
            <div class="col-md-3">
              <label class="form-label">Teléfono principal</label>
              <input type="text" class="form-control" id="telefonoPrincipal">
            </div>
            <div class="col-md-3">
              <label class="form-label">Teléfono secundario</label>
              <input type="text" class="form-control" id="telefonoSecundario">
            </div>
            <div class="col-md-3">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" id="correo">
            </div>
            <div class="col-md-4">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion">
            </div>
            <div class="col-md-4">
              <label class="form-label">Departamento</label>
              <select class="form-select" id="departamento">
                <option value="">Seleccione departamento</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Municipio</label>
              <select class="form-select" id="municipio" disabled>
                <option value="">Seleccione primero un departamento</option>
              </select>
            </div>
             <input type="hidden" id="clienteId" value="">
             <div class="col-12">
               <label class="form-label">Observaciones</label>
               <textarea class="form-control" id="observaciones" rows="3"></textarea>
             </div>
           <div class="col-12 d-flex gap-2">
               <button type="submit" class="btn btn-primary" id="btnGuardarCliente">Guardar cliente</button>
               <button type="button" class="btn btn-outline-secondary" id="btnCancelarEdicion" style="display:none;">Cancelar edición</button>
               <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
             </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Listado de clientes</h2>
            <div class="d-flex gap-2">
              <input type="text" class="form-control form-control-sm" id="buscarCliente" placeholder="Buscar cliente...">
              <button class="btn btn-outline-primary btn-sm" id="btnRecargarClientes">Recargar</button>
            </div>
          </div>

           <div class="table-responsive">
             <table class="table align-middle" id="clientesTable">
               <thead>
                 <tr>
                   <th>ID</th>
                   <th>Tipo</th>
                   <th>Nombre / Razón social</th>
                   <th>Contacto</th>
                   <th>NIT</th>
                   <th>Teléfono</th>
                   <th>Correo</th>
                   <th>Estado</th>
                   <th>Acciones</th>
                 </tr>
               </thead>
               <tbody></tbody>
             </table>
           </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/clientes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
